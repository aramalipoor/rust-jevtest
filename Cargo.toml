[package]
name = "jevtest"
version = "0.3.0"
edition = "2024"
description = "Run only the Rust tests your change can break: crate reach, syn test discovery, a per-test coverage map and TypeSafe Jev judgments, as a cargo nextest filter."
license = "MIT OR Apache-2.0"
repository = "https://github.com/aramalipoor/rust-jevtest"
homepage = "https://github.com/aramalipoor/rust-jevtest"
readme = "README.md"
keywords = ["test-selection", "nextest", "testing", "ai", "cargo-subcommand"]
categories = ["development-tools::testing", "development-tools::cargo-plugins"]
exclude = ["/target"]
default-run = "cargo-jevtest"

[[bin]]
name = "cargo-jevtest"
path = "src/main.rs"

[[bin]]
name = "jevtest"
path = "src/bin/jevtest.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
flate2 = "1.1.10"
globset = "0.4.20"
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
rustc-demangle = "0.1.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
syn = { version = "2", default-features = false, features = ["full", "visit", "parsing", "printing", "clone-impls"] }
toml = "1.1.6"
ureq = { version = "3", features = ["json"] }
